name: Test Dispatch

on:
  workflow_dispatch:

jobs:
  test-dispatch:
    permissions: write-all
    name: Test repository dispatch
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          repositories: dbut2.github.io
          owner: dbut2

      - name: Get latest tag
        id: tag
        run: |
          git fetch --tags
          LATEST_TAG=$(git tag -l 'v*.*.*' | sort -V | tail -n1)
          echo "tag_name=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Using tag: $LATEST_TAG"

      - name: Trigger static site update
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ steps.generate-token.outputs.token }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/dbut2/dbut2.github.io/dispatches \
            -d '{"event_type":"update-external-resource","client_payload":{"resource":"sapphire","tag":"${{ steps.tag.outputs.tag_name }}"}}'

          echo "Dispatched update for tag: ${{ steps.tag.outputs.tag_name }}"
