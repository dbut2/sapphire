name: pre-release

on:
  push:
    branches:
      - main

jobs:
  pre-release:
    permissions: write-all
    name: Create pre-release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Generate tag name
        id: tag
        run: |
          git fetch --tags

          LATEST_TAG=$(git tag -l 'v*.*.*' | grep -v '-' | sort -V | tail -n1)

          VERSION=${LATEST_TAG#v}
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)

          MINOR=$((MINOR + 1))
          NEXT_VERSION="v${MAJOR}.${MINOR}.0"

          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG_NAME="${NEXT_VERSION}-dev.${SHORT_SHA}"

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Generated tag: $TAG_NAME (from latest: $LATEST_TAG)"

      - name: Delete old dev releases
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          gh release list --json tagName,isPrerelease --limit 100 | \
            jq -r '.[] | select(.isPrerelease) | .tagName' | \
            while read tag; do
              gh release delete "$tag" --yes --cleanup-tag
            done

      - name: Create pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          prerelease: true
          token: ${{ steps.generate-token.outputs.token }}
