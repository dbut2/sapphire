name: Quality Checks

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ./go.mod

      - name: Download modules
        run: go mod download

      - name: Decrypt assets
        env:
          SAPPHIRE_KEY: ${{ secrets.SAPPHIRE_KEY }}
        run: make decrypt

      - name: Run tests
        run: go test -v ./gba/...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ./go.mod

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev libgtk-3-dev

      - name: Decrypt assets
        env:
          SAPPHIRE_KEY: ${{ secrets.SAPPHIRE_KEY }}
        run: make decrypt

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9

  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ./go.mod

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev libgtk-3-dev

      - name: Decrypt assets
        env:
          SAPPHIRE_KEY: ${{ secrets.SAPPHIRE_KEY }}
        run: make decrypt

      - name: Build desktop
        run: go build .

      - name: Build WASM
        run: GOOS=js GOARCH=wasm go build ./cmd/web
