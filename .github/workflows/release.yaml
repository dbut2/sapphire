name: Release

on:
  release:
    types: [created]

jobs:
  release:
    permissions: write-all
    name: Release
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          repositories: dbut2.github.io
          owner: dbut2

      - uses: actions/setup-go@v6
        with:
          go-version-file: ./go.mod

      - name: Decrypt assets
        env:
          SAPPHIRE_KEY: ${{ secrets.SAPPHIRE_KEY }}
        run: make decrypt

      - name: Build macOS universal binary
        run: |
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -o build/sapphire-amd64 .
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -o build/sapphire-arm64 .
          lipo -create -output build/sapphire build/sapphire-amd64 build/sapphire-arm64
          mkdir -p Sapphire.app/Contents/MacOS/
          cp build/sapphire Sapphire.app/Contents/MacOS/sapphire

      - name: Build WASM
        run: GOOS=js GOARCH=wasm go build -o build/sapphire.wasm ./cmd/web

      - name: Package macOS
        run: |
          zip -r build/sapphire.zip Sapphire.app
          hdiutil create -volname Sapphire -srcfolder Sapphire.app -ov -format UDZO build/sapphire.dmg

      - name: Upload DMG
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/sapphire.dmg
          asset_name: sapphire.dmg
          tag: ${{ github.ref }}

      - name: Upload ZIP
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/sapphire.zip
          asset_name: sapphire.zip
          tag: ${{ github.ref }}

      - name: Upload WASM
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/sapphire.wasm
          asset_name: sapphire.wasm
          tag: ${{ github.ref }}

      - name: Trigger static site update
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ steps.generate-token.outputs.token }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/dbut2/dbut2.github.io/dispatches \
            -d '{"event_type":"update-external-resource","client_payload":{"resource":"sapphire","tag":"${{ github.ref_name }}"}}'
